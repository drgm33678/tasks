name: Weekly Follow-up List

on:
  schedule:
    # cron 使用 UTC 時間。'0 2 * * 1' = 每週一 02:00 UTC = 台灣週一 10:00。
    - cron: '0 2 * * 1'
  workflow_dispatch:   # 允許在 Actions 頁面手動按鈕觸發（用來測試）

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Send weekly follow-up list
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_TOKEN: ${{ secrets.GAS_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node send-digest.js weekly
