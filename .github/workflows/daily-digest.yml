name: Daily Telegram Digest

on:
  schedule:
    # cron 使用 UTC 時間。'0 1 * * *' = 每天 01:00 UTC = 台灣 09:00。
    # 想改時間：把小時數換成「你要的台灣時間 − 8」。例如台灣 18:00 → 10 → '0 10 * * *'。
    - cron: '0 1 * * *'
  workflow_dispatch:   # 允許在 Actions 頁面手動按鈕觸發（用來測試）

# 需要寫入權限:排程長期沒有 commit 時自動補一筆,避免被 GitHub 停用
permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Send digest
        env:
          JSONBIN_BIN_ID: ${{ secrets.JSONBIN_BIN_ID }}
          JSONBIN_KEY: ${{ secrets.JSONBIN_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node send-digest.js

      # GitHub 會停用「60 天沒有任何 commit」的公開 repo 排程。
      # 距離上次 commit 超過 45 天時,自動更新 .github/keepalive.txt 並 commit,讓排程持續運作。
      # 只在排程觸發時執行;日報發送失敗也照樣執行。
      - name: Keep schedule alive
        if: always() && github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "距離上次 commit: ${days} 天"
          if [ "$days" -ge 45 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive.txt
            git commit -m "chore: keep scheduled workflow alive"
            git push
          fi
